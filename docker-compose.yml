services:
  speechtexter:
    build:
      context: .
      dockerfile: Dockerfile
    image: speechtexter:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:80"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 16M
    labels:
      - "coolify.managed=true"
      - "coolify.type=service"

networks:
  coolify:
    external: true
